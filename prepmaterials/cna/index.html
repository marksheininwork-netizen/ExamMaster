","Wait until shift change"],["A resident is found on the floor. What is the first appropriate action?","Call for help and avoid moving them unnecessarily","Lift them immediately alone","Leave them unattended","Ask them to stand quickly"],["What should be done before transferring a resident into a wheelchair?","Lock wheelchair brakes","Remove prescribed footwear","Unlock brakes","Place chair far away"],["Where should a call light be placed?","Within the resident's reach","At the nurses station","Under the bed","Outside the room"],["Which footwear helps prevent falls?","Properly fitting nonslip footwear","Loose slippers","Socks on slippery floors","Oversized shoes"],["How should an aide lift an object safely?","Bend knees and keep load close","Twist while lifting","Bend at waist with straight knees","Hold load far away"],["What should an aide do with a wet floor?","Protect the area and arrange prompt cleanup","Ignore it","Cover it with loose paper","Encourage residents to walk across it"],["Which action is appropriate when a resident begins choking and cannot speak or cough?","Activate emergency help and provide trained choking first aid","Offer water","Leave to finish paperwork","Ask them to lie down alone"],["Which finding should be reported promptly?","New difficulty breathing","Usual appetite","Normal conversation","Stable baseline mobility"],["What is the appropriate position for most residents during oral feeding?","Upright according to care plan","Flat on back","Head lower than feet","Face down"],["What should an aide do if a resident coughs repeatedly while eating?","Stop feeding and notify the nurse","Feed faster","Offer larger bites","Ignore coughing"],["How should food temperature be checked?","According to facility safety procedures before serving","Assume all food is safe","Taste with resident's spoon","Serve boiling liquids immediately"],["Which action respects a resident's food preferences?","Offer permitted alternatives","Force unwanted food","Withhold all meals","Ignore prescribed diet"],["What should be recorded as fluid intake?","Measured fluids consumed","Amount offered regardless of consumption","Only solid food weight","Urine output"],["How should urine output be measured?","Use a graduated container according to policy","Estimate without measuring","Record the container capacity","Discard before measuring"],["Where should a urinary drainage bag be kept?","Below bladder level and off the floor","Above the bladder","On the resident's lap","On the floor"],["Which observation should be reported during catheter care?","New blood in urine","Usual clear yellow urine","Secure tubing","Normal output"],["How should perineal care generally proceed for a female resident?","Front to back","Back to front","Without changing soiled cloth areas","With harsh disinfectant"],["Which action helps prevent pressure injuries?","Reposition according to the care plan","Massage persistent redness","Keep linens wrinkled","Leave skin wet"],["What should an aide do when persistent redness is found over a heel?","Relieve pressure and report it","Massage vigorously","Apply heat without orders","Ignore it"],["Which action protects skin during repositioning?","Use appropriate lifting aids to reduce friction","Drag resident across sheets","Pull by wrists","Use rough linens"],["How should dentures be handled during cleaning?","Protect them from breakage over a lined basin","Use boiling water","Wrap in disposable tissue and discard","Share with another resident"],["Which action is appropriate during oral care for a dependent resident?","Follow aspiration precautions in the care plan","Pour large amounts of water into mouth","Leave resident unattended","Use another resident's toothbrush"],["How should soiled linens be handled?","Keep away from uniform and place in designated container","Shake in the room","Place on floor","Carry against face"],["When should gloves be worn?","When contact with body fluids is anticipated","Instead of hand hygie ation?","Authorized care team members with a need to know","Friends","Other residents","Social media followers"],["What should an aide do if abuse is suspected?","Protect safety and report promptly according to law and policy","Wait for absolute proof","Keep it secret","Confront alone regardless of safety"],["Which example is neglect?","Failing to provide required basic care","Respecting a capable resident's refusal","Offering permitted choices","Reporting a concern"],["Which example violates resident rights?","Taking personal belongings without permission","Providing privacy","Respecting choices","Explaining care"],["What should an aide do if asked to perform a task outside authorized scope?","Decline and notify the supervising nurse","Perform it secretly","Ask a visitor to perform it","Document it as completed"],["Who establishes or changes the nursing care plan?","Authorized licensed nursing professionals","Any visitor","The aide independently","Other residents"],["What should an aide do with an unexpected vital sign reading?","Report promptly according to policy","Change it to a normal value","Ignore it","Diagnose the condition independently"],["What is counted when measuring respiratory rate?","Breaths per minute","Heartbeats per minute","Steps per minute","Fluid ounces"],["Where is a radial pulse measured?","Wrist","Ankle","Abdomen","Forehead"],["Which action improves accuracy of a routine weight measurement?","Use consistent conditions and the prescribed scale","Guess from appearance","Use different units without conversion","Include unrelated equipment"],["Which observation suggests possible dehydration?","New dry mouth and reduced urine output","Normal moist mouth","Usual urine output","Normal fluid intake"],["Which finding should be reported during bowel care?","New black tarry stool","Usual formed brown stool","Normal bowel pattern","Routine toileting request"],["What should an aide do when a resident has new vomiting?","Protect from aspiration and notify
